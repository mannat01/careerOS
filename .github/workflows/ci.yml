name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: careeros
          POSTGRES_DB: careeros_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careeros -d careeros_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://careeros:careeros@localhost:5432/careeros_test
      REDIS_URL: redis://localhost:6379
      S3_BUCKET: careeros-artifacts
      AUTH_PROVIDER: dev
      DEV_AUTH_SECRET: ci-dev-auth-secret-that-is-at-least-32-chars
      APPROVAL_TOKEN_SECRET: ci-test-secret-ci-test-secret-32ch
      LLM_PRIMARY_PROVIDER: anthropic
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Canonical DB tooling is deploy-only and value-free
        run: make db-tooling-test
      - name: Circular dependency check (madge)
        run: pnpm exec madge --circular --extensions ts packages/config/src packages/contracts/src packages/capability-gate/src packages/connectors/src packages/observability/src packages/db/src packages/cie/resume/src apps/api/src
      - name: Prisma generate (typed client for @careeros/db)
        run: pnpm --filter @careeros/db exec prisma generate
      - name: Typecheck
        run: pnpm -w typecheck
      - name: Lint (incl. import-boundary rules)
        run: pnpm -w lint
      - name: Web production build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          NEXT_PUBLIC_AUTH_PROVIDER: clerk
          AUTH_PROVIDER: clerk
        run: pnpm --filter @careeros/web build
      - name: Prisma schema validate
        run: pnpm --filter @careeros/db schema:validate
      - name: Migration check (deploy is a no-op if migrations are in sync)
        run: pnpm --filter @careeros/db exec prisma migrate deploy
      - name: Seed SourceRegistry (greenhouse) for integration tests
        run: pnpm --filter @careeros/db exec tsx src/seed.ts
      - name: Integration tests (Prisma-backed stores against live Postgres)
        run: pnpm --filter @careeros/db test:integration
      - name: e2e tests (booted NestJS app; Postgres+Redis; in-memory ObjectStorage fake)
        run: pnpm --filter @careeros/api test:integration
      - name: Unit + integration + security + eval-gate suites
        run: pnpm -w test
      # Permanent gates: capability-gate + connector allow-list security suites and the
      # zero-fabrication evals run inside `pnpm -w test` and MUST stay green.
      - name: Eval gates (GREEN allowlist only — extraction + state-model + tailoring zero-fabrication)
        # BLOCKING merge gate. Runs ONLY the currently-green eval suites via the
        # explicit allowlist in evals/vitest.eval-ci.config.ts. The M03 scoring
        # gate remains RED-by-design until the scoring step and is kept OUT of
        # this subset on purpose. When an eval turns green, add it to the
        # GREEN_EVAL_SUITES allowlist in that config and it becomes a permanent
        # gate here too.
        run: pnpm --filter @careeros/evals eval:ci
      - name: FM1 six guarantees (compile-fail + runtime) — BLOCKING
        run: pnpm --filter @careeros/web test:guarantees
      - name: FM1 contract-backed MSW fixture regression — BLOCKING
        run: pnpm --filter @careeros/web test:fixtures
      - name: FM1 route axe matrix + keyboard ApprovalDialog — BLOCKING
        run: pnpm --filter @careeros/web test:axe
      - name: Install Playwright Chromium
        run: pnpm --filter @careeros/web exec playwright install --with-deps chromium
      - name: FM1 real local-stack Twin SSE smoke — BLOCKING
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_AUTH_PROVIDER: dev
          LLM_PROVIDER: fake
        run: pnpm --filter @careeros/web test:e2e

